<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Venkat Prasad</title>

    <link rel="stylesheet" href="stylesheet.css">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="header">

        <a href="index.html" class="logo">
            Portfolio
        </a>


        <nav class="navbar">

            <a href="index.html" style="--i:1">
                Home
            </a>

            <a href="About.html" style="--i:2">
                About
            </a>

            <a href="skills.html" style="--i:3">
                Skills
            </a>

            <a href="project.html" style="--i:4">
                Project
            </a>

            <a href="contact.html" style="--i:5" class="active">
                Contact
            </a>

        </nav>

    </header>


    <!-- ================= CONTACT SECTION ================= -->

    <section class="contact-section">


        <div class="contact-container">


            <!-- LEFT SIDE -->

            <div class="contact-info">

                <p class="contact-title">
                    CONTACT ME
                </p>


                <h1>
                    Let's <span>Connect</span>
                </h1>


                <p class="contact-description">

                    I am currently looking for opportunities where
                    I can learn, grow and contribute as a Java
                    Full-Stack Developer.


                </p>


                <!-- EMAIL -->

                <div class="contact-item">

                    <div class="contact-icon">

                        <i class='bx bx-envelope'></i>

                    </div>


                    <div>

                        <h3>
                            Email
                        </h3>

                        <a href="patilvenkatprasad11@gmail.com">
                            patilvenkatpeasad11@gmail.com
                        </a>

                    </div>

                </div>


                


             
                <!-- LOCATION -->

                <div class="contact-item">

                    <div class="contact-icon">

                        <i class='bx bx-map'></i>

                    </div>


                    <div>

                        <h3>
                            hydrabad
                        </h3>

                        <p>
                            India
                        </p>

                    </div>

                </div>


                <!-- SOCIAL MEDIA -->

                <div class="contact-social">

                    <a href="https://www.linkedin.com/in/patil-venkat-prasad-31a53a397/" aria-label="LinkedIn">

                        <i class='bx bxl-linkedin'></i>

                    </a>


                    <a href="https://github.com/patilvenkatprasad11/portfolio" aria-label="GitHub">

                        <i class='bx bxl-github'></i>

                    </a>


                    <a href="https://www.instagram.com/patil_venkatprasad/?hl=en"
                       aria-label="Instagram">

                        <i class='bx bxl-instagram'></i>

                    </a>

                </div>


            </div>



            <!-- RIGHT SIDE -->

            <div class="contact-form-container">


                <form class="contact-form">


                    <div class="input-row">

                        <input
                            type="text"
                            placeholder="Your Name"
                            required
                        >


                        <input
                            type="email"
                            placeholder="Your Email"
                            required
                        >

                    </div>


                    <input
                        type="text"
                        placeholder="Subject"
                        required
                    >


                    <textarea
                        placeholder="Your Message"
                        rows="8"
                        required
                    ></textarea>


                    <button
                        type="submit"
                        class="contact-btn"
                    >

                        Send Message

                        <i class='bx bx-send'></i>

                    </button>


                </form>

            </div>


        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 Venkat Prasad. All Rights Reserved.
        </p>

    </footer>


</body>

</html>
